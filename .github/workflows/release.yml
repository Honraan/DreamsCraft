# DreamsCraft Release Pipeline:
# Compiles and publishes to GitHub Releases:
#   - Android arm64 (arm64-v8a):     dreamscraft-<version>-android-arm64.apk
#   - Android arm32 (armeabi-v7a):   dreamscraft-<version>-android-arm32.apk
#   - Desktop Linux (x86_64):        dreamscraft-<version>-linux-x86_64.AppImage / .deb / .tar.gz
#   - Desktop Windows (x64):         dreamscraft-<version>-windows-x64.msi / -portable.zip
#   - Checksums:                     SHA256SUMS.txt
#
# Triggered automatically when pushing a version tag (e.g. `v1.0.0`) or manually via Actions > Release > Run workflow.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create/update the GitHub Release with compiled binaries'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_VERSION: "1.99.0"
  NDK_VERSION: "29.0.14206865"

jobs:
  apk:
    name: Android APK (arm64 + arm32)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            v="$listed"
            tag="v$listed"
          fi
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a valid semver version like 1.0.0 or 1.0.0-beta"
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "### DreamsCraft $tag (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - name: Install cargo-ndk and the Android NDK
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >>"$GITHUB_ENV"

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PROCRAFT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.p12"
            echo "PROCRAFT_KEYSTORE=$RUNNER_TEMP/release.p12" >>"$GITHUB_ENV"
          else
            echo "::notice::PROCRAFT_KEYSTORE_BASE64 secret not set; signing release APKs with fallback key so APKs are installable."
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android arm64 (arm64-v8a) and arm32 (armeabi-v7a)
        working-directory: android
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PROCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PROCRAFT_KEYSTORE_PASSWORD }}
          PROCRAFT_KEY_ALIAS: ${{ secrets.PROCRAFT_KEY_ALIAS }}
          PROCRAFT_KEY_PASSWORD: ${{ secrets.PROCRAFT_KEY_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for build in arm64-v8a:arm64 armeabi-v7a:arm32; do
            ./gradlew --no-daemon :app:assembleRelease "-Pprocraft.abis=${build%:*}"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/dreamscraft-$VERSION-android-${build#*:}.apk"
          done

      - name: Verify APKs
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          echo >>"$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            {
              echo "    $(basename "$apk")"
              grep -E "certificate (DN|SHA-256)" <<<"$certs" | sed 's/^/      /'
            } >>"$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*
          if-no-files-found: error

      - name: Remove temporary release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
          - name: linux-x86_64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DIST: ${{ github.workspace }}/dist
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          listed="$(sed -n 's/^procraft\.version=//p' android/gradle.properties | tr -d '\r')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="$listed"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-desktop-${{ matrix.name }}

      - name: Install WiX v5
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >>"$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Package for Windows (x64)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: ./packaging/windows/package.ps1

      - name: Install nfpm
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" nfpm
          sudo install -m755 "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends desktop-file-utils >/dev/null

      - name: Package for Linux (x86_64)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: bash packaging/linux/package.sh

      - name: Rename desktop packages to dreamscraft-*
        run: |
          for f in dist/procraft-*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            mv "$f" "dist/${base/#procraft-/dreamscraft-}"
          done
          ls -l dist >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [apk, desktop]
    if: ${{ !cancelled() && needs.apk.result == 'success' && needs.desktop.result == 'success' && (github.ref_type == 'tag' || inputs.publish_release != false) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.apk.outputs.tag }}
      VERSION: ${{ needs.apk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate SHA-256 Checksums
        run: |
          (cd dist && sha256sum -- * >SHA256SUMS.txt && cat SHA256SUMS.txt >>"$GITHUB_STEP_SUMMARY")

      - name: Create or update GitHub Release
        run: |
          NOTES="## DreamsCraft $TAG

          ### Downloads
          - **Android (64-bit ARM / arm64-v8a):** \`dreamscraft-$VERSION-android-arm64.apk\`
          - **Android (32-bit ARM / armeabi-v7a):** \`dreamscraft-$VERSION-android-arm32.apk\`
          - **Linux (x86_64):** \`dreamscraft-$VERSION-linux-x86_64.AppImage\`, \`.deb\`, \`.tar.gz\`
          - **Windows (x64):** \`dreamscraft-$VERSION-windows-x64.msi\`, \`-portable.zip\`
          - **Checksums:** \`SHA256SUMS.txt\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber -- dist/*
            echo "Updated existing release **$TAG** with compiled binaries." >>"$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "DreamsCraft $TAG" --notes "$NOTES" -- dist/*
            echo "Published release **$TAG**." >>"$GITHUB_STEP_SUMMARY"
          fi
